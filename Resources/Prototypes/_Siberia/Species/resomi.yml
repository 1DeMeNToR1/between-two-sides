# TODO: резоми не могут ранить других резоми :trollface:
- type: species
  id: Resomi
  name: species-name-resomi
  roundStart: true
  prototype: MobResomi
  sprites: MobResomiSprites
  defaultSkinTone: "#00cccc"
  markingLimits: MobResomiMarkingLimits
  dollPrototype: MobResomiDummy
  skinColoration: Hues # TintedHues
  maleFirstNames: names_reptilian_male
  femaleFirstNames: names_reptilian_female
  naming: FirstLast # FirstDashFirst
  minAge: 15
  maxAge: 45
  youndAge: 25
  oldAge: 40
  
  
- type: speciesBaseSprites
  id: MobResomiSprites
  sprites:
    Head: MobResomiHead
    Hair: MobResomiMarkingFollowSkin
    Snout: MobHumanoidAnyMarking
    Chest: MobResomiTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Eyes: MobResomiEyes
    Tail: MobHumanoidAnyMarking
    LArm: MobResomiLArm
    RArm: MobResomiRArm
    LHand: MobResomiLHand
    RHand: MobResomiRHand
    LLeg: MobResomiLLeg
    RLeg: MobResomiRLeg
    LFoot: MobResomiLFoot
    RFoot: MobResomiRFoot

- type: markingPoints
  id: MobResomiMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 1
      required: true
      defaultMarkings: [ ResomiHairEars1 ]
    FacialHair:
      points: 0
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ ResomiTailClassic ]
    HeadTop:
      points: 1
      required: false
    HeadSide:
      points: 1
      required: false

