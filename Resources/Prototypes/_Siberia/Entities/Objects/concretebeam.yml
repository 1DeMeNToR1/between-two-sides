- type: entity
  id: Concrete2BeamJaraten
  name: Бетонная стена.
  parent: BaseStructure
  description: Крепкая бетонная стена.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Siberia/Objects/Construction/concretebeam.rsi
    state: beam2
    drawdepth: Overdoors
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: StructuralMetallic
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
          acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 3

