- type: entity
  name: АШ-12
  parent: BaseWeaponSubMachineGun
  id: WeaponAssaultRifle
  description: Штурмовой автомат, используемый спецназом, для борьбы с террористами. Использует боеприпасы .45 магнум.
  components:
  - type: Sprite
    sprite: Siberia/Objects/Weapons/Guns/Rifles/ashrifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Siberia/Objects/Weapons/Guns/Rifles/ashrifle.rsi
  - type: Gun
    minAngle: 0
    maxAngle: 25
    fireRate: 5
    angleIncrease: 5
    angleDecay: 16
    soundGunshot:
      path: /Audio/Siberia/Weapons/Rifles/ash12.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Siberia/Weapons/Rifles/ash12.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineAssaultRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineAssaultRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnum
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
