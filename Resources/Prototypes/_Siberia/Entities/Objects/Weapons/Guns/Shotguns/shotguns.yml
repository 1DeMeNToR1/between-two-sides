- type: entity
  name: сайга-12А
  parent: BaseWeaponRifle
  id: WeaponShotgunSaiga
  description: модифицированная версия знаменитого гладкоствольного карабина с возможностью ведения автоматического огня
  components:
  - type: Sprite
    sprite: Siberia/Objects/Weapons/Guns/Shotguns/saiga12.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Siberia/Objects/Weapons/Guns/Shotguns/saiga12.rsi
  - type: Gun
    fireRate: 3 #3 выстрела в секунду(у бульдога 2, у калаша 5)
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineSaiga12
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineSaiga12
      gun_chamber:
        name: Chamber
        startingItem: ShellShotgun
        priority: 1
        whitelist:
          tags:
            - ShellShotgun
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
