- type: entity
  parent: BaseHealingItem
  id: FuelpackIPC
  suffix: Full
  components:
  - type: Tag
    tags:
    - Bloodpack
  - type: Sprite
    sprite: Objects/Misc/stock_parts.rsi
    state: bluespace_matter_bin
  - type: Healing
    damageContainers:
      - BiologicalIPC
