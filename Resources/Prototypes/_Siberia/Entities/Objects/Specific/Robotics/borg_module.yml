# Swarmers

- type: entity
  id: BaseSwarmModule
  parent: BaseBorgModule
  abstract: true
  components:
  - type: Sprite
    sprite: Siberia/Objects/Specific/Robotics/swarmmodule.rsi
  - type: Tag
    tags:
    - SwarmModule


- type: entity
  id:  SwarmModuleRCD
  parent: [ BaseSwarmModule, BaseProviderBorgModule ]
  name: модуль строителя-дрона роя
  components:
  - type: Sprite
    layers:
    - state: swarm
    - state: icon-swarm
  - type: ItemBorgModule
    items:
    - RCDSwarm
  - type: Item
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#EBD8B7"
      - state: base-module-inhand-left
        color: "#613D1D"
      - state: base-stripes-inhand-left
        color: "#593718"
      right:
      - state: base-icon-inhand-right
        color: "#EBD8B7"
      - state: base-module-inhand-right
        color: "#613D1D"
      - state: base-stripes-inhand-right
        color: "#593718"

- type: entity
  id: SwarmModuleMed
  parent: [ BaseSwarmModule, BaseProviderBorgModule ]
  name: модуль лекаря-дрона роя
  components:
  - type: Sprite
    layers:
    - state: swarm
    - state: icon-swarm
  - type: ItemBorgModule
    items:
    - SwarmHealerHypospray
    - WelderSwarm
  - type: Item
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#EBD8B7"
      - state: base-module-inhand-left
        color: "#613D1D"
      - state: base-stripes-inhand-left
        color: "#593718"
      right:
      - state: base-icon-inhand-right
        color: "#EBD8B7"
      - state: base-module-inhand-right
        color: "#613D1D"
      - state: base-stripes-inhand-right
        color: "#593718"
