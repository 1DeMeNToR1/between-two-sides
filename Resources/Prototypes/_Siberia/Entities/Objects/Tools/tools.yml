# Swarmers

- type: entity
  id: RCDSwarm
  parent: [ BaseItem ]
  name: Устройство строительства
  description: Древнее устройство, имеющее схожее устройство работы с РСУ.
  components:
  - type: RCD
    successSound: /Audio/Magic/Cults/ClockCult/steam_whoosh.ogg
    availablePrototypes:
    - WallSwarm
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 20
    charges: 20
  - type: AutoRecharge
    rechargeDuration: 15
  - type: UseDelay
  - type: Sprite
    sprite: Siberia/Mobs/Silicon/BioSwarm/rcd.rsi
    state: icon
  - type: Item
    size: Normal
  - type: PhysicalComposition
    materialComposition:
      Steel: 600
      Plastic: 100
  - type: StaticPrice
    price: 0
  - type: UserInterface
    interfaces:
      enum.RcdUiKey.Key:
        type: RCDMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.RcdUiKey.Key
  - type: MeleeWeapon # Самниитеельна, но оокеей.. 
    damage:
      types:
        Blunt: 12
        Structural: 25