- type: entity
  parent: BaseFoodCondiment
  id: BaseFoodCondimentSqueezeBottle
  abstract: true
  name: бутылка для соусов
  description: Тонкий пластиковый контейнер, используемый для хранения соусов.
  components:
  - type: Edible
    edible: Food # usually contains powders like flour or condiments like ketchup
    solution: food
    destroyOnEmpty: false
    utensil: Spoon
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
  - type: RefillableSolution
    solution: food
  - type: Spillable
    solution: food
  - type: SolutionTransfer
    canChangeTransferAmount: true
    minTransferAmount: 5
    maxTransferAmount: 30
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  - type: Sprite
    sprite: Siberia/Objects/Consumable/Food/condiments.rsi
  - type: Icon
    sprite: Siberia/Objects/Consumable/Food/condiments.rsi
