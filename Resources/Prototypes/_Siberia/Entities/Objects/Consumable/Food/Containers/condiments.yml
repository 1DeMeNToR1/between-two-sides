    # sound:
      # collection: squeezeBottleUseSounds
      # params:
        # variation: 0.125

- type: entity
  parent: BaseFoodCondimentSqueezeBottle
  id: FoodCondimentSqueezeBottleKetchup
  name: бутылка кетчупа
  description: Бутылка кетчупа. Что тут еще можно сказать?
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Ketchup
          Quantity: 30
  - type: Tag
    tags:
      - Ketchup
  - type: Sprite
    state: squeeze-bottle-ketchup
  - type: Icon
    state: squeeze-bottle-ketchup

- type: entity
  parent: BaseFoodCondimentSqueezeBottle
  id: FoodCondimentSqueezeBottleMustard
  name: бутылка горчицы
  description: Бутылка горчицы. Что тут еще можно сказать?
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Mustard
          Quantity: 30
  - type: Tag
    tags:
      - Mustard
  - type: Sprite
    state: squeeze-bottle-mustard
  - type: Icon
