- type: entity
  name: чипсы с беконом
  parent: FoodSnackBase
  id: ChipsBacon
  description: Чипсы из "настоящего" картофеля, со вкусом бекона.
  components:
  - type: FlavorProfile
    flavors:
      - bacon
      - potatoes
  - type: Sprite
    sprite: Siberia/Objects/Consumable/Food/chips.rsi
    state: bacon
    scale: 0.5, 0.5
  - type: Item
  - type: Edible
    trash:
    - ChipsBaconTrash

- type: entity
  parent: BaseItem
  id: ChipsBaconTrash
  name: пустой пакет чипсов
  description: Мусор.
  components:
  - type: Sprite
    sprite: Siberia/Objects/Consumable/Food/chips.rsi
    state: bacon_trash
    scale: 0.5, 0.5
  - type: Item
    size: Tiny

