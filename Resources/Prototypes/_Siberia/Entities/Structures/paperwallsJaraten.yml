- type: entity
  parent: BaseWall
  id: WallPaperJaraten1
  name: Бумажная стена
  description: Удерживает мастеров боевых искусств внутри, а ассистентов снаружи.
  components:
  - type: Sprite
    sprite: Siberia/Structures/paper_wallJaraten.rsi
  - type: Icon
    sprite: Siberia/Structures/paper_wallJaraten.rsi
  - type: Construction
    graph: Girder
    node: paperWall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300 # #excess damage (nuke?). avoid computational cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/metalbreak.ogg
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
    destroySound:
      path: /Audio/Effects/metalbreak.ogg
  - type: IconSmooth
    key: walls
    base: paperwall

