- type: construction
  name: Укреплённый деревянный стол
  id: TableWoodReinforced
  graph: Table
  startNode: start
  targetNode: TableWoodReinforced
  category: construction-category-furniture
  description: Квадратный кусок дерева, стоящий на четырех металлических ножках. Очень прочный.
  icon:
    sprite: Siberia/Nyanotrasen/rwood.rsi
    state: full
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
    - !type:TileNotBlocked

- type: entity
  id: PaperDoorJaraten
  name: Бумажная дверь
  parent: WoodDoor
  description: Дверь, но куда она ведёт?
  components:
  - type: Sprite
    sprite: Siberia/Structures/paper_doorJaraten.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: DoorGraph
    node: paperDoor