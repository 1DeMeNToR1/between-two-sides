- type: entity
  parent: VendingMachine
  id: VendingMachineSibChips
  name: торгомат Sib Co
  description: Автомат торгующий чипсами малоизвестной корпорации Sib Co.
  components:
  - type: VendingMachine
    pack: SibVendInventory
    dispenseOnHitChance: 0.25
    dispenseOnHitThreshold: 2
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    ejectState: eject-unshaded
    denyState: deny-unshaded
    ejectDelay: 1.9
    initialStockQuality: 0.33
  - type: Sprite
    sprite: Siberia/Structures/Machines/VendingMachines/sibvend.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#0abc11"
  - type: SpeakOnUIClosed
    pack: SibVendAds
