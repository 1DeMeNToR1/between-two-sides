- type: entity
  id: WoodenSignJaraten
  name: Деревянная табличка.
  description: Она куда-то указывает.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Siberia/Structures/Decoration/minesJaraten.rsi
    state: sign_left
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.4,0.35,0.4"
        density: 100
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/chop.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
          acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          Log:
            min: 1
            max: 1

- type: entity
  parent: WoodenSign
  id: WoodenSignRightJaraten
  name: Деревянная табличка.
  description: Она куда-то указывает.
  components:
  - type: Sprite
    sprite: Siberia/Structures/Decoration/minesJaraten.rsi
    state: sign_right

- type: entity
  id: WoodenSupportJaraten
  parent: BaseStructure
  name: Деревянная опора.
  description: Помогает удержать потолок на своём законном месте.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Siberia/Structures/Decoration/minesJaraten.rsi
    state: support
    drawdepth: Overdoors
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.5,0.1,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/chop.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
          acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          Log:
            min: 1
            max: 3

