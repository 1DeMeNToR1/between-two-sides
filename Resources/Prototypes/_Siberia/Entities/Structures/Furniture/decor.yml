- type: entity
  id: DecorationWoodenclock
  parent: BaseStructure
  name: деревянные часы
  description: Деревянные часы делают тик-так... тик-так... Кто это сказал?!
  components:
  - type: Sprite
    sprite: Siberia/Structures/Decoration/woodenclock.rsi
    state: clock
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50

      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 3
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: InteractionOutline
  - type: Clickable
  - type: Tag
    tags:
    - Wooden
  - type: Anchorable

- type: entity
  name: микрофон
  id: DecorationMicrophone
  description: Сделайте вид что вы великий комик! А погодите... Вы же клоун.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - TableMask
  - type: Sprite
    sprite: Siberia/Structures/Decoration/micro.rsi
    state: micro
    noRot: true
    drawdepth: Overdoors
  - type: Pullable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: StaticPrice
    price: 10
  - type: Anchorable
  - type: Rotatable
  
- type: entity
  id: BlindsBase
  abstract: true
  parent: BaseStructure
  name: жалюзи
  description: "Закройте пожалуйста жалюзи, идёт серьёзный разговор"
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: WallMount
    arc: 175
    direction: 180
  - type: Rotatable
  - type: Occluder
  - type: AnimationPlayer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - Opaque
  - type: Door
    canCrush: false
    performCollisionCheck: false
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0.5
    closeTimeTwo: 0.1
    openTimeOne: 0.5
    openTimeTwo: 0.1
    openSound:
      path: /Audio/Effects/curtain_openclose.ogg
    closeSound:
      path: /Audio/Effects/curtain_openclose.ogg
  - type: Appearance
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood  
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
        
- type: entity
  id: BlindsCentr
  suffix: Центр, Закрыты
  parent: BlindsBase
  components:
  - type: Sprite
    sprite: Siberia/Structures/Decoration/blinds.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  id: BlindsCentrOpen
  parent: BlindsCentr
  suffix: Центр, Открыты
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
    
- type: entity
  id: BlindsLeft
  suffix: Левые, Закрыты
  parent: BlindsBase
  components:
  - type: Sprite
    sprite: Siberia/Structures/Decoration/blindsleft.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  id: BlindsLeftOpen
  parent: BlindsLeft
  suffix: Левые, Открыты
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
    
- type: entity
  id: BlindsRight
  suffix: Правые, Закрыты
  parent: BlindsBase
  components:
  - type: Sprite
    sprite: Siberia/Structures/Decoration/blindsright.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  id: BlindsRightOpen
  parent: BlindsRight
  suffix: Правые, Открыты
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
    
