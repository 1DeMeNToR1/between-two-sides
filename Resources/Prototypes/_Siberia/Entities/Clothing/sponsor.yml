# OopsieDoopsie
- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterAtmosianBomberJacket
  name: atmosian bomber jacket
  description: A thick, well-worn atmosian leather bomber jacket.
  suffix: Sponsor
  components:
    - type: Sprite
      sprite: Corvax/Clothing/OuterClothing/Coats/atmosian.rsi
    - type: Clothing
      sprite: Corvax/Clothing/OuterClothing/Coats/atmosian.rsi

- type: entity
  parent: ClothingMaskGas
  id: ClothingMaskGasAtmosian
  name: atmosian gas mask
  description: Improved gas mask utilized by atmospheric technicians. It's flameproof!
  suffix: Sponsor
  components:
    - type: Sprite
      sprite: Corvax/Clothing/Mask/atmosian.rsi
    - type: Clothing
      sprite: Corvax/Clothing/Mask/atmosian.rsi
    - type: Armor
      modifiers:
        coefficients:
          Heat: 0.80

- type: entity
  parent: ClothingNeckBase
  id: ClothingCloakAtmosian
  name: atmosian's cloak
  description: The cloak of a legendary Atmosian.
  suffix: Sponsor
  components:
    - type: Sprite
      sprite: Corvax/Clothing/Neck/Cloaks/atmosian.rsi

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskSkull
  name: skull mask
  description: Spooky skull mask.
  suffix: Sponsor
  components:
    - type: Sprite
      sprite: Corvax/Clothing/Mask/death.rsi
    - type: Clothing
      sprite: Corvax/Clothing/Mask/death.rsi
    - type: BreathMask

- type: entity
  parent: ClothingNeckBase
  id: ClothingCloakGamer
  name: legendary gamer's cloak
  description: Worn by the most skilled professional gamers.
  suffix: Sponsor
  components:
    - type: Sprite
      sprite: Corvax/Clothing/Neck/Cloaks/gamer.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitSkeleton
  name: skeleton jumpsuit
  description: A black jumpsuit with a white bone pattern printed on it. Spooky!
  suffix: Sponsor
  components:
    - type: Sprite
      sprite: Corvax/Clothing/Uniforms/Jumpsuit/skeleton.rsi
    - type: Clothing
      sprite: Corvax/Clothing/Uniforms/Jumpsuit/skeleton.rsi

- type: entity
  parent: ClothingBackpackSatchel
  id: ClothingBackpackSatchelHoS
  name: head of security's satchel
  description: Stylish, leather black satchel
  suffix: Sponsor
  components:
    - type: Sprite
      sprite: Corvax/Clothing/Back/Satchels/hos.rsi

- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltHoS
  name: leather security belt
  description: Stylish, leather black belt
  suffix: Sponsor
  components:
    - type: Sprite
      sprite: Corvax/Clothing/Belt/hos.rsi
    - type: Clothing
      sprite: Corvax/Clothing/Belt/hos.rsi
    - type: Storage
      whitelist:
        tags:
          - CigPack
          - Taser
          - SecBeltEquip
          - Radio
        components:
          - Stunbaton
          - FlashOnTrigger
          - Flash
          - Handcuff
    - type: ItemMapper
      mapLayers:
        flashbang:
          whitelist:
            components:
              - FlashOnTrigger
        stunbaton:
          whitelist:
            components:
              - Stunbaton
      sprite: Clothing/Belt/belt_overlay.rsi
    - type: Appearance

