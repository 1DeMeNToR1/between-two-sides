  name: armored overcoat
  description: Pretty old stuff for these times, bringing back old memories...
  suffix: Sponsor
  components:
    - type: Sprite
      sprite: Corvax/Clothing/OuterClothing/Coats/hos_overcoat.rsi
    - type: Clothing
      sprite: Corvax/Clothing/OuterClothing/Coats/hos_overcoat.rsi
    - type: Armor
