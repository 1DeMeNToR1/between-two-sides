  name: мантия Квартирмейстера
  description: Утончённая мантия, созданная по заказу для одного из Глав станции, Квартирмейстера. Если приглядеться, то можно заметить на нём знамя отдела Снабжения, что инкрустировано золотом. Также вы можете ощутить приятный запах корицы, исходящий от неё.
  components:
  - type: Sprite
    sprite: Siberia/Clothing/Head/Hats/QMmantle.rsi
  - type: Clothing
    sprite: Siberia/Clothing/Head/Hats/QMmantle.rsi

