- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakFreedomCloak
  name: плащ отряда разведки
  description: Зелёный плащ разведывательного корпуса. "Отдадим свои сердца!"
  components:
  - type: Sprite
    sprite: Siberia/Clothing/Neck/Cloaks/freedomcloak.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodFreedomCloak
    requiredSlot:
    - neck
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}

- type: entity
