- type: entity
  parent: ClothingHeadHardsuitWithLightBase
  id: ClothingHeadHelmetHardsuitSpatioUpgraded
  noSpawn: true
  name: улучшенный лёгкий шлем скафандра утилизатора
  components:
  - type: Sprite
    sprite: Siberia/Clothing/31_08/salvageupghelmet.rsi
    layers:
    - state: icon
    - state: icon-flash
  - type: Clothing
    sprite: Siberia/Clothing/31_08/salvageupghelmet.rsi
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
      - state: unshade
        shader: unshaded
  - type: PointLight
    color: "#E5CE8F"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    coefficient: 0.005

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitSpatioUpgraded
  name: улучшенный лёгкий скафандр утилизатора
  description: Лёгкий как пёрышко! Железное пёрышко...
  components:
  - type: Sprite
    sprite: Siberia/Clothing/31_08/salvageupg.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: Siberia/Clothing/31_08/salvageupg.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.72
    lowPressureMultiplier: 10000
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.95
        Heat: 0.9
        Radiation: 0.75 #salv is supposed to have radiation hazards in the future
        Caustic: 0.85
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitSpatioUpgraded

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesBootsMagUpgraded
  name: модифицированные магнитные сапоги
  description: Магнитные сапоги с модификацией джетпака и облегчённым весом
  components:
  - type: Sprite
    sprite: Siberia/Clothing/31_08/magboots-upg.rsi
    state: icon
  - type: Clothing
    sprite: Siberia/Clothing/31_08/magboots-upg.rsi
  - type: Magboots
    toggleAction: ActionToggleMagbootsSyndie
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.9
    enabled: false
  - type: GasTank
    outputPressure: 42.6
    air:
      # 2 minutes of thrust
      volume: 0.75
      temperature: 293.15
      moles:
        - 0.153853429 # oxygen
        - 0.153853429 # nitrogen
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: Explosive
    explosionType: Default
    maxIntensity: 20
  - type: Jetpack
    moleUsage: 0.00085
  - type: CanMoveInAir
  - type: InputMover
    toParent: true
  - type: MovementSpeedModifier
    weightlessAcceleration: 1
    weightlessFriction: 0.3
    weightlessModifier: 1.2
  - type: Tag
    tags:
      - WhitelistChameleon
