- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitMedicalRndUpgraded
  name: улучшенный скафандр медика
  description: Спецкостюм защищающий ангелов смерти от воздействия многих опасных факторов среды. Лёгкие материалы обеспечивают подвижность, но абсолютно не защищают от физического воздействия. В шлем встроены все нужные визоры, а на спину установлен баллон с дополнительными подсумками. Скафандр поглощает микрочастицы, медленно образуя во внутреннем хранилище омнизин. Объём танка составляет 50u.
  components:
  - type: Sprite
    sprite: Siberia/Clothing/OuterClothing/Hardsuits/medupgraded.rsi
  - type: Clothing
    sprite: Siberia/Clothing/OuterClothing/Hardsuits/medupgraded.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.1
        Heat: 0.1
        Radiation: 0
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitMedicalRndUpgraded
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 5
      moles:
        - 2.051379050
      temperature: 293.15
  - type: ExaminableSolution
    solution: tank
  - type: DrawableSolution
    solution: tank
  - type: InjectableSolution
    solution: tank
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 20
  - type: SolutionRegeneration
    solution: tank
    generated:
      reagents:
      - ReagentId: Omnizine
        Quantity: 0.20
  - type: ReagentTank
  - type: Storage
    grid:
    - 0,0,6,3
    clickInsert: false
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UseDelay
    delay: 0.5

