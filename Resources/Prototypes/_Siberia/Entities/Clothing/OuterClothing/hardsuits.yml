- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitSecurityWarden
  name: скафандр смотрителя
  description: Дорогой скафандр разработанный для защиты не только от космического давления, но и от большинства видов повреждений
  components:
  - type: Sprite
    sprite: Siberia/Clothing/OuterClothing/Hardsuits/warden.rsi
  - type: Clothing
    sprite: Siberia/Clothing/OuterClothing/Hardsuits/warden.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 10000
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.8
        Radiation: 0.25
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitSecurityWarden

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitEngineeringRndUpgraded
  name: улучшенный инженерный скафандр
  description: Скафандр, напоминающий циклопа из-за своего визора. Обладает внутренним хранилищем, более ярким фонариком, встроенным баллоном и джетпаком. Пластины из гибридного сплава позволяют легче двигаться. В шлем скафандра встроен дополнительный сканер массы.
  components:
  - type: Sprite
    sprite: Siberia/Clothing/OuterClothing/Hardsuits/engupgraded.rsi
  - type: Clothing
    sprite: Siberia/Clothing/OuterClothing/Hardsuits/engupgraded.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.04
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    coefficient: 0.01
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Shock: 0.7
        Caustic: 0.4
        Radiation: 0
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitEngineeringRndUpgraded
  - type: Storage
    grid:
    - 0,0,6,3
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 5
      moles:
        - 2.051379050
      temperature: 293.15
  - type: InputMover
    toParent: true
  - type: MovementSpeedModifier
    weightlessAcceleration: 1
    weightlessFriction: 0.3
    weightlessModifier: 1.2
  - type: CanMoveInAir
  - type: Jetpack
    moleUsage: 0.00085

