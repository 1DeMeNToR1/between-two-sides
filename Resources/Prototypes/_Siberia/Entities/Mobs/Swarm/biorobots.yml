######################### БАЗА #############################
- type: entity
  save: false
  abstract: true
  id: MobSwarmbotBase
  components:
  - type: ItemToggle
    onActivate: false
    activated: false
    onUse: false
  - type: AccessToggle
  - type: LagCompensation
  - type: Clickable
  - type: Damageable
    damageContainer: Biological
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed : 2
    baseSprintSpeed : 3
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: NpcFactionMember
    factions:
    - BioSwarm
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - SwarmRadio
  - type: ActiveRadio
    channels:
    - SwarmRadio
  - type: HealthExaminable
    examinableTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
    locPrefix: silicon
  - type: MovedByPressure
  - type: Physics
    bodyType: KinematicController
  - type: NoSlip
  - type: MovementAlwaysTouching
  - type: CanMoveInAir
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Stutter
    - Electrocution
  - type: NameIdentifier
    group: GenericNumber
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 8
  - type: Tag
    tags:
    - DoorBumpOpener
    - Swarm
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      70: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:TriggerBehavior
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SwarmRewardSphere:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Input
    context: "human"
  - type: InputMover
  - type: MobMover
  - type: Body
    # prototype: SwarmBot
  - type: Speech
    speechVerb: Robotic
  - type: TypingIndicator
    proto: robot
  - type: ZombieImmune
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: MicroBomb
    totalIntensity: 2
    intensitySlope: 1
    maxIntensity: 1
    canCreateVacuum: false
    deleteAfterExplosion: false
  - type: Appearance
  - type: CombatMode
  - type: MeleeWeapon
    hidden: true
    damage:
      groups:
        Brute: 5
  - type: Actions
  - type: Alerts
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: CameraRecoil
  - type: MindContainer
  - type: Polymorphable
  - type: StatusIcon
  - type: Hands
    showInHands: false
  - type: Inventory
  - type: Insulated
  - type: Tool
    speedModifier: 1.5
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Prying
    pryPowered: !type:Bool
        true
    force: !type:Bool
      true
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: IgnoreSpiderWeb
  - type: BorgChassis
    selectedModule: null
    hasMindState: light
    noMindState: light
    moduleWhitelist:
      tags:
      - SwarmModule
  - type: ContainerContainer
    containers:
      borg_module: !type:Container { }
      cell_slot: !type:ContainerSlot { }
  - type: Pullable
  - type: Puller
    needsHands: false
  - type: UserInterface
    interfaces:
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
      enum.BorgUiKey.Key:
        type: BorgBoundUserInterface
  - type: ActivatableUI
    key: enum.BorgUiKey.Key
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: BioSwarm
  - type: IonStormTarget
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: PowerCellDraw
    drawRate: 0.6
  - type: Reactive
    reactions:
    - reagents: [ SwarmNanomachines ]
      methods: [ Touch, Ingestion, Injection ]
      effects:
      - !type:HealthChange
        damage:
          groups:
            Burn: -10
            Brute: -10
            Toxin: -10
          types:
            Bloodloss: -20
      - !type:PopupMessage
        type: Local
        messages: [ "swarmbot-heal-by-nano-popup" ]
        probability: 0.25
  - type: SolutionContainerManager
  - type: InjectableSolution
    solution: chemicals
  - type: Bloodstream
    bloodMaxVolume: 250
    bloodReagent: SwarmNanomachines
    bloodlossDamage:
      types:
        Bloodloss: 1
    bloodlossHealDamage:
      types:
        Bloodloss: -1
  # - type: Metabolizer
    # solutionOnBody: false
    # updateFrequency: 0.8
    # metabolizerTypes: [ Dragon ]
    # groups:
      # - id: Medicine
      # - id: Poison
  - type: Advertise
    pack: SwarmAds
    maximumWait: 240
    minimumWait: 180
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 3.5
    color: "#18FFE6"
    softness: 1
    autoRot: true


######################### СТРОИТЕЛЬ РОЯ #############################

- type: entity
  parent: MobSwarmbotBase
  id: MobSwarmbotBuilder
  name: дрон-строитель роя
  description: Биоробот, разбирающий станцию на мелкие кирпичики и распростроняющий шестерни роя. Является приоритетной целью охраны дронов-стражей роя.
  components:
  - type: Sprite
    scale: 0.8, 0.8
    drawdepth: Mobs
    layers:
    - map: ["enum.BorgVisualLayers.Light"]
      state: light
      sprite: Siberia/Mobs/Silicon/BioSwarm/robobuilder.rsi
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
      sprite: Siberia/Mobs/Silicon/BioSwarm/robobuilder.rsi
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: unshade
      shader: unshaded
      sprite: Siberia/Mobs/Silicon/BioSwarm/robobuilder.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-swarmbulder-name
    description: ghost-role-information-swarmbulder-description
  - type: GhostTakeoverAvailable
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Spider
    webPrototype: SwarmWeb
    webAction: ActionSwarmFloor
  - type: ContainerFill
    containers:
      borg_module:
        - SwarmModuleRCD
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellAntiqueProto
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Siberia/Mobs/Swarm/spiderbiofootstep.ogg
      params:
        volume: -6
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
    - Flesh
  - type: Speech
    speechSounds: Swarm
  - type: SwarmDrone
  - type: ProtectedFromStepTriggers

