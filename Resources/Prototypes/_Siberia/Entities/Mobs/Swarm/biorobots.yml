  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 15500
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-swarmadept-name
    description: ghost-role-information-swarmadept-description
  - type: GhostTakeoverAvailable
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellAntiqueProto
  - type: Tag
    tags:
    - DoorBumpOpener
    - Flesh
  - type: Speech
    speechSounds: Swarm
  - type: ProtectedFromStepTriggers
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:TriggerBehavior
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SwarmRewardSphere:
            min: 4
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Biological
  - type: ShowHealthIcons
    damageContainers:
    - Biological
    - Inorganic
  - type: SolutionScanner
  - type: Bloodstream
    bloodMaxVolume: 650
  - type: Devourer
    foodPreference: Humanoid
    shouldStoreDevoured: true
    chemical: Ichor
    healRate: 15.0
    whitelist:
      components:
      - Door
      tags:
      - Wall
  - type: Dragon
    # spawnsLeft: 2
    # spawnsProto: MobSwarmbotBuilder
    spawnRiftAction: ActionSpawnFactory
    riftPrototype: SwarmbotFactory
    maxAccumulator: 99999999
  - type: Hunger
    thresholds: # only animals and rats are derived from this prototype so let's override it here and in rats' proto
      Overfed: 20000
      Okay: 50
      Peckish: 25
      Starving: 10
      Dead: 0
    baseDecayRate: 0.00925925925926 # it is okay for animals to eat and drink less than humans, but more frequently
  - type: SwarmAdept
    hungerPerArmyUse: 0
    hungerPerDomainUse: 0
