#################### ИНСТРУМЕНТЫ РОЯ ##########################
- type: entity
  name: спрей дрона роя
  parent: BaseItem
  description: Инжектор наномашин, который использует дрон-лекарь роя.
  id: SwarmHealerHypospray
  components:
  - type: Sprite
    sprite: Siberia/Mobs/Silicon/BioSwarm/hypospray.rsi
    state: hypo
  - type: Item
    sprite: Siberia/Mobs/Silicon/BioSwarm/hypospray.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    onlyAffectsMobs: false
  - type: UseDelay
    delay: 0.5
  - type: SolutionRegeneration
    solution: hypospray
    generated:
      reagents:
      - ReagentId: SwarmNanomachines
        Quantity: 2
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 4

- type: entity
  name: спрей дрона роя
  parent: BaseItem
  description: Инжектор наномашин, который использует дрон-лекарь роя. Кажется в нём кончились наномашины...
  id: SwarmHealerHyposprayNormal
  components:
  - type: Sprite
    sprite: Siberia/Mobs/Silicon/BioSwarm/hypospray.rsi
    state: hypo
  - type: Item
    sprite: Siberia/Mobs/Silicon/BioSwarm/hypospray.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    onlyAffectsMobs: false
  - type: UseDelay
    delay: 0.5
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 4

- type: entity
  name: сварочный аппарат роя
  parent: WelderIndustrial
  id: WelderSwarm
  description: "Странное устройство роя. Кажется им можно забивать фелинидов"
  components:
  - type: Sprite
    sprite: Siberia/Mobs/Silicon/BioSwarm/welder_industrialadv.rsi
  - type: Item
    sprite: Siberia/Mobs/Silicon/BioSwarm/welder_industrialadv.rsi
  - type: SolutionContainerManager
    solutions:
      Welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 250
        maxVol: 250
  - type: Tool
    speedModifier: 1.3

#################### СТРУКТУРЫ РОЯ ##########################

- type: entity
  id: SwarmWeb
  name: покрытие роя
  description: Странная механическая поверхность. При ходьбе по ней втыкает шипы.
  placement:
    mode: SnapgridCenter
    snap:
      - Wall
  components:
    - type: MeleeSound
      soundGroups:
        Brute:
          path:
            "/Audio/Weapons/smash.ogg"
    - type: Sprite
      sprite: Siberia/Mobs/Silicon/BioSwarm/gear.rsi
      layers:
        - state: floor
      drawdepth: WallMountedItems
    - type: GenericVisualizer
      visuals:
        enum.SpiderWebVisuals.Variant:
          spiderWebLayer:
            1:  {state: floor}
            2:  {state: floor1}
    - type: Appearance
    - type: Clickable
    - type: Transform
      anchored: true
    - type: Physics
    - type: Fixtures
      fixtures:
        fix1:
          hard: false
          density: 7
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          layer:
          - MidImpassable
    - type: Damageable
      damageModifierSet: Wood
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:SpawnEntitiesBehavior
          spawn:
            SheetPlasteel:
              min: 2
              max: 5
    - type: Temperature
      heatDamage:
        types:
          Heat: 5
      coldDamage: {}
      coldDamageThreshold: 0
    - type: Flammable
      fireSpread: true
      damage:
        types:
          Heat: 5
    - type: Reactive
      groups:
        Flammable: [Touch]
        Extinguish: [Touch]
    - type: SpiderWebObject
    - type: DamageContacts
      damage:
        types:
          Piercing: 1.5
      ignoreWhitelist:
        tags:
        - Swarm

- type: entity
  id: SwarmbotFactory
  name: завод дронов роя
  description: Странное устройство, поглощающее энергию и создающее дронов роя.
  placement:
    mode: SnapgridCenter
  components:
  - type: DragonRift
    spawn: MobSwarmbotBuilder
    spawnCooldown: 120000000
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    layers:
    - sprite: Siberia/Mobs/Silicon/BioSwarm/factory.rsi
      state: factory
  - type: InteractionOutline
  - type: Clickable
  - type: PointLight
    enabled: true
    color: "#d06116"
    radius: 10.0
    energy: 5.0
    netsync: false
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 550
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
  # - type: Timer
  # - type: TimedSpawner
    # prototypes:
      # - MobSwarmbotGuard
      # - MobSwarmbotHealer
      # # round ~90m
      # # one spawner should only spawn ~5 mice for sanity reasons
      # # therefore 18m
      # # use 50% chance for randomness and balance with halved interval
    # chance: 0.5
    # intervalSeconds: 180
    # minimumEntitiesSpawned: 1
    # maximumEntitiesSpawned: 1
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSink
  - type: Battery
    maxCharge: 750000000
    pricePerJoule: 0.0003
  - type: ExaminableBattery
  - type: PowerConsumer
    voltage: High
    drawRate: 10000
  - type: WarpPoint
    location: swarmfactory
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: Lathe
    idleState: factory
    runningState: factory
    staticRecipes:
      - SwarmbotBuilder
      - SwarmbotGuard
      - SwarmbotHealer
  - type: ResearchClient
  - type: TechnologyDatabase
  - type: ApcPowerReceiver
    powerLoad: 0
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
#################### РАЗНОЕ РОЯ ##########################

- type: speechSounds
  id: Swarm
  saySound:
    path: /Audio/Siberia/Mobs/Swarm/Borg.ogg
  askSound:
    path: /Audio/Siberia/Mobs/Swarm/Borg.ogg
  exclaimSound:
    path: /Audio/Siberia/Mobs/Swarm/Borg.ogg

- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseSwarmAdeptObjective
  components:
  - type: Objective
    difficulty: 1.5
    issuer: objective-issuer-swarm
  - type: RoleRequirement
    roles:
      components:
      - DragonRole

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseSwarmAdeptObjective
  id: SwarmFactoryObjective
  components:
  - type: Objective
    icon:
      sprite: Siberia/Mobs/Silicon/BioSwarm/factory.rsi
      state: factory
  - type: NumberObjective
    min: 3
    max: 3
    title: objective-swarm-factory-title
    description: objective-swarm-factory-description
  - type: CarpRiftsCondition

- type: entity
  categories: [ HideSpawnMenu ]
  parent: [BaseSwarmAdeptObjective, BaseSurviveObjective]
  id: SwarmAdeptSurviveObjective
  name: Выжить
  description: Вы должны оставаться в живых, чтобы сохранять контроль.
  components:
  - type: Objective
    icon:
      sprite: Siberia/Mobs/Silicon/BioSwarm/bigbibot.rsi
      state: alive

- type: hitscan
  id: SwarmLaser
  damage:
    types:
      Heat: 5
      Radiation: 5
  muzzleFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: muzzle_xray
  travelFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: xray
  impactFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: impact_xray

- type: entity
  name: disabler bolt
  id: BulletDisablerSwarm
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: bluespace
      shader: unshaded
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Ammo
  - type: StaminaDamageOnCollide
    damage: 20
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Heat: 5
    soundHit:
      collection: WeakHit
    forceSound: true

- type: entity
  parent: BaseSubdermalImplant
  id: SwarmEmpImplant
  name: EMP implant
  description: This implant creates an electromagnetic pulse when activated.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      implantAction: ActionActivateEmpSwarm
    - type: TriggerImplantAction
    - type: EmpOnTrigger
      range: 10
      energyConsumption: 500000
      disableDuration: 20

- type: localizedDataset
  id: SwarmAds
  values:
    prefix: advertisement-swarm-
    count: 7

#################### ХИМИКАТ РОЯ ##########################

- type: reagent
  id: SwarmNanomachines
  name: reagent-name-swarmnanomachines
  group: Toxins
  desc: reagent-desc-swarmnanomachines
  flavor: metallic
  color: "#6e6e6e"
  physicalDesc: reagent-physical-desc-vibrant
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          groups:
            Brute: 2
      - !type:PopupMessage
        type: Local
        visualType: MediumCaution
        messages: [ "generic-reagent-effect-swarmmachines" ]
        probability: 0.33
