- type: entity
  name: ксено-горничная
  id: MobXenoMaidDark
  parent: SimpleSpaceMobBase
  suffix: тёмная
  description: Искусственно выведенный мирный ксеноморф горничная.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Siberia/Mobs/Pets/xenomaid.rsi
    scale: 1.2,1.2
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: xenomaid
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead
  - type: Temperature
    currentTemperature: 310.15
  - type: TemperatureDamage
    heatDamageThreshold: 360
    coldDamageThreshold: -150
    coldDamage:
      types:
        Cold: 0.1 
    heatDamage:
      types:
        Heat: 1.5
  - type: Hands
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
    - CannotSuicide
  - type: DamageStateVisuals
    states:
      Alive:
        Base: xenomaid
      Dead:
        Base: xenomaid_dead
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: FoodMeatXeno
      amount: 5
  - type: MeleeWeapon
    hidden: true
    soundHit:
        path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 10
        Caustic: 5
  - type: MobPrice
    price: 10000
  - type: Tool
    speedModifier: 1.5
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: TypingIndicator
    proto: alien
  - type: NoSlip
  - type: Speech
    speechVerb: LargeMob

- type: entity
  name: ксено-горничная
  id: MobXenoMaidWhite
  parent: MobXenoMaidDark
  suffix: светлая
  description: Искусственно выведенный мирный ксеноморф горничная.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Siberia/Mobs/Pets/xenomaid_white.rsi
    scale: 1.2,1.2
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: xenomaid
