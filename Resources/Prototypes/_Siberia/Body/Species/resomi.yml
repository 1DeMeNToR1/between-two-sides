- type: entity
  parent:
  - AppearanceResomi
  - BaseSpeciesMobOrganic
  id: MobResomi
  name: Urist McResomi
  components:
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Resomi
  - type: Stamina
    baseCritThreshold: 90
  - type: Speech
    speechVerb: Resomi
    speechSounds: Lizard
  - type: Vocal
    sounds:
      Male: UnisexResomi
      Female: UnisexResomi
      Unsexed: UnisexResomi
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatChicken
      amount: 3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          FoodMeatChickenFriedVox:
            min: 3
            max: 3
      - !type:BurnBodyBehavior
        popupMessage: bodyburn-vox-text-others
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 40
      behaviors:
      - !type:VomitBehavior
  - type: PassiveDamage
    # Augment normal health regen to be able to tank some Poison damage
    # This allows Resomi to take their mask off temporarily to eat something without needing a trip to medbay afterwards.
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.04
        Blunt: -0.05
        Piercing: -0.03
        Slash: -0.03
        Poison: -0.1 # needs to be less than the PendingZombieComponent does or they never become zombies by the disease.
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Siberia/Mobs/Effects/brute_damage_resomi.rsi
        color: "#D514F7"
      Burn:
        sprite: Siberia/Mobs/Effects/burn_damage_resomi.rsi
  - type: FireVisuals
    sprite: Siberia/Mobs/Effects/onfire.rsi
    normalState: Resomi_burning
    alternateState: Resomi_burning
  - type: MeleeWeapon
    # hidden: true
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 2
  - type: Temperature
    currentTemperature: 313.15
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 410
    coldDamageThreshold: 273.15 # 285
    coldDamage:
      types:
        Cold : 0.1 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat : 0.1 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      301: 0.9
      295: 0.8
      285: 0.7

  - type: ResomiAccent
  - type: MovementSpeedModifier
    baseWeightlessAcceleration: 1.5 # Move around more easily in space.
    baseWeightlessFriction: 1.1
    baseWeightlessModifier: 1.1
  - type: Bloodstream
    bloodReagent: ResomiBlood



