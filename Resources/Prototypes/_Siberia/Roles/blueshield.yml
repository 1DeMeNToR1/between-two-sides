- type: job
  id: Blueshield
  name: офицер "Синий Щит"
  description: Вы нянька Nanotrasen. Охраняйте глав от антагонистов. Не занимайтесь охотой на антагонистов, это не ваша работа.
  playTimeTracker: JobBlueshield
  requirements:
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 108000000 #200 hrs
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 108000000 #200 hrs
    - !type:DepartmentTimeRequirement
      department: Security
      time: 144000000 #200 hrs
    - !type:DepartmentTimeRequirement
      department: Command
      time: 108000000 # 15000 hours
    - !type:OverallPlaytimeRequirement
      time: 252000000 #140 hrs
  weight: 20
  startingGear: BlueShieldGear
  icon: "JobIconBlueShield"
  requireAdminNotify: true
  joinNotifyCrew: true
  supervisors: job-supervisors-centcom
  canBeAntag: false
  access:
  - Maintenance
  - Engineering
  - Command
  - External
  - Research
  - Brig
  - Security
  - Armory
  - Service
  - Medical
  - Cargo
  - Salvage
  - Blueshield
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: statusIcon
  parent: JobIcon
  id: JobIconBlueShield
  icon:
    sprite: Interface/Misc/job_icons.rsi
    state: Blueshield

