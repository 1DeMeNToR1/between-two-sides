- type: entity
  name: ионная винтовка
  parent: BaseWeaponBattery
  id: WeaponIonRifle
  description: Ионная винтовка, созданная дворфом-оружейником. Имеет один заряд и после выстрела уходит на перезарядку. Офицеры "Синий Щит" часто отбрасывают винтовку после выстрела и добивают негодяя револьвером с бронебойными патронами, так что оружейники укрепили каркас винтовки.
  components:
  - type: Sprite
    sprite: Siberia/Roles/BlueShield/ionrifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-1
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Siberia/Roles/BlueShield/ionrifle.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Siberia/resonator_blast.ogg
  - type: HitscanBatteryAmmoProvider
    proto: IonLaser
    fireCost: 80
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 20
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 750

- type: hitscan
  id: IonLaser
  staminaDamage: 80
  damage:
    types:
      Heat: 60
  muzzleFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: muzzle_omni
  travelFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: beam_omni
  impactFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: impact_omni

- type: entity
  parent: BaseSubdermalImplant
  id: DeathRattleImplantNanotrasen
  name: Имплант оповещения о смерти
  description: Этот имплант сообщит о потере сознания/смерти своего владельца в медицинский канал станции
  noSpawn: true
  components:
    - type: SubdermalImplant
      permanent: true
    - type: TriggerOnMobstateChange
      mobState:
      - Critical
      - Dead
    - type: Rattle
      radioChannel: Medical

- type: entity
  id: DeathRattleImplanterNanotrasen
  name: Имплант оповещения о смерти
  parent: BaseImplantOnlyImplanter
  components:
    - type: Implanter
      implant: DeathRattleImplantNanotrasen

