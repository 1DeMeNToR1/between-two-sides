- type: job
  id: Blueshield
  name: офицер "Синий Щит"
  description: Вы нянька Nanotrasen. Охраняйте глав от антагонистов. Не занимайтесь охотой на антагонистов, это не ваша работа.
  playTimeTracker: JobBlueshield
  requirements:
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 72000 #20 hours # Siberia-RoleTime
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 72000 #20 hours # Siberia-RoleTime
    - !type:DepartmentTimeRequirement
      department: Security
      time: 180000 # 50 hours # Siberia-RoleTime
    - !type:DepartmentTimeRequirement
      department: Command
      time: 180000 # 50 hours # Siberia-RoleTime
  weight: 20
  startingGear: BlueShieldGear
  icon: "JobIconBlueShield"
  requireAdminNotify: true
  whitelisted: true
  supervisors: job-supervisors-centcom
  canBeAntag: false
  access:
  - Maintenance
  - Engineering
  - Command
  - External
  - Research
  - Brig
  - Security
  - Armory
  - Service
  - Medical
  - Cargo
  - Salvage
  - Blueshield
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: BlueShieldGear
  equipment:
    shoes: ClothingShoesBootsJack
    eyes: ClothingEyesGlassesSunglasses
    head: ClothingHeadHatBeretBlueshield
    id: BlueshieldPDA
    ears: ClothingHeadsetAltCommand
    belt: ClothingBeltAssault
    pocket1: WeaponPistolMk58
    pocket2: CrowbarRed

- type: playTimeTracker
