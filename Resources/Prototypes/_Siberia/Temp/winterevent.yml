- type: entity
  id: AvroraHelicopter
  parent: AltarBase
  name: Вертолёт W-Corp
  description: Вертолёт компании W-Corp, практичное средство доставки на большое растояние в условиях заснеженных планет.
  components:
  - type: TimedDespawn
    lifetime: 42.0
  - type: SpriteFade
  - type: Sprite
    sprite: Siberia/Temp/helicopter.rsi
    drawdepth: Overdoors
    state: on
  - type: Icon
    sprite: Siberia/Temp/helicopter.rsi
    state: icon
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Siberia/Temp/helicopter-work.ogg
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-2.0,-2.0,4.2,0.6"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 99999
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 99999
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 5
          MaterialCloth1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: SpawnOnDespawn
    prototype: avrorhelicopterend


