- type: gameMap
  id: Avrora
  mapName: 'NX-Avrora-701'
  mapPath: /Maps/Siberia/avroravixen.yml
  minPlayers: 0
  maxPlayers: 99
  stations:
    Avrora:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Аврора {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: ''
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_amber.yml
        - type: StationJobs
          availableJobs:
            ExpeditionCapitane: [ 1, 1 ]
            ExpeditionMedic: [ 3, 3 ]
            ExpeditionWorker: [ -1, -1 ]

- type: department
  id: Event
  name: departament-event-avrora-name
  description: departament-event-avrora-desc
  color: "#9FED58"
  weight: 10
  roles:
  - ExpeditionCapitane
  - ExpeditionMedic
  - ExpeditionWorker
  primary: false

- type: entity
  id: NecroMarker
  name: обелиск
  description: странное чувство вызывает у меня эта штука... я хочу быть единым...
  placement:
    mode: SnapgridCenter
    snap:
      - Wall
  components:
    - type: AmbientSound
      volume: 0
      range: 8
      sound:
        path: /Audio/Ambience/Objects/gravity_gen_hum.ogg
    - type: RangedDamageSound
      soundGroups:
        Brute:
          collection:
            MeatBulletImpact
      soundTypes:
        Heat:
          collection:
            MeatLaserImpact
    # - type: Timer
    - type: Clickable
    - type: InteractionOutline
    - type: Sprite
      netsync: false
      sprite: Siberia/Temp/necromarker.rsi
      layers:
        - state: on
        # - state: wardingtower-unshaded
          # shader: unshaded
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: Transform
      anchored: false
      noRot: true
    - type: Physics
      bodyType: Static
    - type: Anchorable
    - type: Pullable
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-1.5,0.5,1.5"
          density: 1000
          mask:
          - LargeMobMask
          layer:
          - WallLayer
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 50000
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: PointLight
      radius: 4
      energy: 2
      castShadows: false
      color: "#A30707FF"
    - type: StaticPrice
      price: 500000
