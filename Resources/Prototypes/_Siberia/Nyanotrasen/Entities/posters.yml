- type: entity
  parent: PosterBase
  id: PosterLegitMedicate
  name: "Принимайте лекарства"
  description: "Возможные побочные эффекты могут включать: тошноту, расстройство желудка, воспаление, отек лица/горла, сыпь, лихорадку, головную боль, головокружение, рвоту и/или диарею, образование синяков, судороги, непреодолимую зевота, общее чувство дискомфорта или болезни, крапивницу. потеря голоса, кровоточивость десен и/или глазных яблок, потеря аппетита, повышенный аппетит, внезапное начало плача, рентгеновское зрение, невнятная речь, импровизированная левитация, недержание мочи, резкий неконтролируемый приступ йодлинга, бессонница, нарколепсия, проказа, спонтанный рост новых конечностей/гениталий, непрекращающийся рост волос на спине, потеря веса, увеличение веса, усадка, дальтонизм, онемение прямой кишки, острая способность различать цвета, неутолимая жажда крови, беспокойные ногти, светочувствительность, принуждение носить школьную форму, цинга, стремление вести наемническую жизнь, неистовая жажда козьей крови, бунтарское желание развить пристрастие к азартным играм, зудящая задница. Свяжитесь со своим врачом для получения медицинской консультации по поводу этих или любых других побочных эффектов, которые могут возникнуть у вас." #credit Chris Zappa
  components:
  - type: Sprite
    sprite: Siberia/Nyanotrasen/Velcroboy.rsi
    state: poster_medicate

